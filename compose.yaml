services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsetrack
      POSTGRES_USER: pulsetrack
      POSTGRES_PASSWORD: pulsetrack_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pulsetrack_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetrack -d pulsetrack"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  pulsetrack_db_data:
